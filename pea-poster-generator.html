<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEA Poster Generator</title>

<style>
:root{--p:#5b2a86;--p2:#7b3fa8;--y:#ffd84a;--o:#f5a21a;--r:#d40f1c;--bg:#efe9f7;--ui:#fff;--tx:#2a1a3a}
*{box-sizing:border-box}
body{margin:0;font-family:'Kanit',sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
#panel{width:360px;flex:none;background:var(--ui);padding:16px;overflow:auto;height:100vh;position:sticky;top:0;border-right:1px solid #d9cce8}
#panel h2{margin:0 0 10px;font-size:18px;color:var(--p)}
#panel label{display:block;font-size:13px;font-weight:500;margin:10px 0 3px}
#panel input,#panel textarea{width:100%;font:inherit;font-size:14px;padding:7px 9px;border:1px solid #c9b8dd;border-radius:8px}
#panel textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 78px 78px 28px;gap:5px;margin-bottom:5px}
.row input{padding:6px}
.row button{border:0;background:#eee;border-radius:6px;cursor:pointer}
.btn{width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px;font:600 15px 'Kanit';cursor:pointer;background:var(--p);color:#fff}
.btn.alt{background:#eee;color:var(--p);font-size:13px;padding:7px}
details{margin-top:10px;font-size:13px}
#stage{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
#scaler{transform-origin:top center}

function addSlot(l='',a='',b=''){
  if(document.querySelectorAll('#slots .row').length>=3)return;
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<input class="sl" placeholder="ช่วง" value="${l}"><input class="sa" type="time" value="${a}"><input class="sb" type="time" value="${b}"><button type="button">✕</button>`;

  d.querySelectorAll('input').forEach(i=>i.oninput=render);
  $('slots').appendChild(d);
}
addSlot('ช่วงเช้า','09:30','10:30');addSlot('ช่วงบ่าย','14:00','16:00');
$('addSlot').onclick=()=>{addSlot('ช่วง','','');render()};
function render(){
  const v=$('fDate').value;
  if(v){const [y,m,d]=v.split('-').map(Number);const dt=new Date(y,m-1,d);
    $('oDate').textContent=`วัน${DAYS[dt.getDay()]} ที่ ${d} ${MON[m-1]} ${y+543}`;}
  const rows=[...document.querySelectorAll('#slots .row')],n=Math.max(rows.length,1);
  const h=Math.min(54,Math.floor(112/n)-5),k=h/54;
  $('oSlots').innerHTML=rows.map(r=>{
    const l=r.querySelector('.sl').value,a=fmt(r.querySelector('.sa').value),b=fmt(r.querySelector('.sb').value);
    const early=/เช้า/.test(l);
    return `<div class="slot" style="height:${h}px"><img src="${SUN[early?0:1]}" style="height:${h}px"><div class="bd" style="font-size:${30*k}px;background:linear-gradient(90deg,${early?'#fff704,#fee265':'#fecd07,#fee15f'})">${esc(l)} : เวลา <b style="font-size:${35*k}px">${a} – ${b}</b> น.</div></div>`}).join('');
  const ar=$('fAreas').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const box=$('oAreas'),one=ar.length<=4,rw=one?ar.length:Math.ceil(ar.length/2);
  box.className='abs alist'+(one?' one':'');
  box.style.gridTemplateRows=one?'':`repeat(${rw},auto)`;
  box.innerHTML=ar.map(s=>`<div>${esc(s)}</div>`).join('');
  box.style.top=(737-rw*15)+'px';
  $('oLoc').innerHTML=`<img src="${PIN}"><span>${esc($('fTam').value)}</span><span>${esc($('fAmp').value)}</span><span>${esc($('fProv').value)}</span>`;
  $('oWork').innerHTML=esc($('fWork').value).replace(/\n/g,'<br>');
}
['fDate','fAreas','fTam','fAmp','fProv','fWork'].forEach(id=>$(id).addEventListener('input',render));
function fit(){const w=$('stage').clientWidth-32;const s=Math.min(1,w/1200);
  $('scaler').style.transform=`scale(${s})`;$('scaler').style.width='1200px';$('scaler').style.height=(1312*s)+'px';}
addEventListener('resize',fit);
$('dl').onclick=async()=>{
  const btn=$('dl');btn.textContent='กำลังสร้างภาพ...';
  try{await document.fonts.ready;
    const c=await html2canvas($('poster'),{scale:2,useCORS:true,backgroundColor:null,
      onclone:d=>{const s=d.getElementById('scaler');s.style.transform='none';s.style.height='auto'}});
    const a=document.createElement('a');a.download='PEA-poster-'+($('fDate').value||'draft')+'.png';a.href=c.toDataURL('image/png');a.click();
  }catch(e){alert('สร้างภาพไม่สำเร็จ: '+e.message)}
  btn.textContent='⬇ ดาวน์โหลดโปสเตอร์ (PNG)';
};
render();fit();
</script>
</body>
</html>
